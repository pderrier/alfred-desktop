[package]
name = "alfred-desktop-backend"
version = "0.4.13"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Deep-link plugin — v0.4.0 P0-15. Registers the `alfred://` URI scheme on
# Win/macOS/Linux so the Lemon Squeezy checkout fallback path
# (alfred://license-activated?key=...) can focus + activate the running app.
# Pin to 2.4 (latest as of 2026-05-17 is 2.4.9) — same major as `tauri = "2"`.
tauri-plugin-deep-link = "2.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["json", "tls"] }
tungstenite = "0.24"
regex = "1"
# MON-E (P0-83): stable per-machine fingerprint for the comp-code device
# slot (up to 2 machines per code, server-side). Reads the OS-native machine
# id without root; we never transmit the raw id — only a salted FNV-1a hash.
machine-uid = "0.6"

[dev-dependencies]
tempfile = "3"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
